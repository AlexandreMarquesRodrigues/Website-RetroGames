<script>
document.addEventListener("DOMContentLoaded", () => {

    let notaSelecionada = 0;

    const estrelas = document.querySelectorAll(".estrela");

    estrelas.forEach((estrela, index) => {

        estrela.addEventListener("click", () => {

            notaSelecionada = index + 1;

            estrelas.forEach((e, i) => {

                if (i < notaSelecionada) {
                    e.classList.add("ativa");
                } else {
                    e.classList.remove("ativa");
                }

            });

        });

    });

    window.avaliarSite = function() {

        if (notaSelecionada === 0) {
            alert("Selecione uma nota.");
            return;
        }

        alert(
            "Obrigado pela avaliação de " +
            notaSelecionada +
            " estrela(s)!"
        );

        setTimeout(() => {
            location.reload();
        }, 500);

    };

    document.querySelectorAll(".navbar a").forEach(botao => {

    botao.addEventListener("click", function(e) {

        e.preventDefault();

        const secao = this.dataset.section;

        const elemento = document.getElementById(secao);

        if (elemento) {
            elemento.scrollIntoView({
                behavior: "smooth"
        });
    }

    });

});

});
</script>

    <script>
const input = document.getElementById("searchInput");
const button = document.getElementById("searchButton");

function pesquisar() {

    const pesquisa = input.value.toLowerCase();

    const resultado = gamesDatabase.find(game =>
        game.search.toLowerCase().includes(pesquisa)
    );

    if (resultado) {

        window.location.href =
            resultado.page + "?search=" +
            encodeURIComponent(pesquisa);

    } else {

        alert("Jogo não encontrado.");

    }
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        pesquisar();
    }
});

button.addEventListener("click", pesquisar);
</script>
